<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy Consumption Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            width:420px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding:35px;
            border-radius:20px;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:28px;
            color:#00ffd5;
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:15px;
            background:rgba(255,255,255,0.15);
            color:white;
        }

        input::placeholder{
            color:#ddd;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#00ffd5;
            color:#111;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#00c9a7;
            transform:scale(1.03);
        }

        .result{
            margin-top:25px;
            padding:18px;
            border-radius:15px;
            background:rgba(255,255,255,0.1);
            text-align:center;
        }

        .result h2{
            margin-bottom:12px;
            color:#00ffd5;
        }

        .result p{
            font-size:20px;
            font-weight:bold;
            color:white;
        }

        .footer{
            text-align:center;
            margin-top:18px;
            font-size:13px;
            color:#ccc;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>⚡ Smart Energy Predictor</h1>

        <form action="/predict" method="POST">

            <div class="input-group">
                <label>Temperature (°C)</label>
                <input type="number" step="any" name="temperature" placeholder="Enter temperature" required>
            </div>

            <div class="input-group">
                <label>Humidity (%)</label>
                <input type="number" step="any" name="humidity" placeholder="Enter humidity" required>
            </div>

            <div class="input-group">
                <label>Day</label>
                <input type="number" name="day" placeholder="Enter day" required>
            </div>

            <div class="input-group">
                <label>Month</label>
                <input type="number" name="month" placeholder="Enter month" required>
            </div>

            <div class="input-group">
                <label>Hour</label>
                <input type="number" name="hour" placeholder="Enter hour" required>
            </div>

            <button type="submit">Predict Energy Usage</button>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>Predicted Energy Usage</h2>
            <p>{{ prediction }} kWh</p>

            <br>

            <h2>Estimated Electricity Bill</h2>
            <p>₹ {{ bill }}</p>

        </div>

        {% endif %}

        <div class="footer">
            AI-Based Smart Energy Consumption Prediction System
        </div>

    </div>

</body>
</html>
